# inksep presets: copy this file into your working directory as "inksep.ini".
#
#   inksep input.png output.svg --preset sparse
#
# Keys are the CLI flags without "--" (underscores work too). Physical sizes
# are millimetres. true/false for flags. Lines starting with # or ; are
# comments; a trailing # after a value comments out the rest of the line.
# Sections merge left to right; explicit command-line flags always win.

[DEFAULT]
dpi = 300
min-dot = 0.3
generations = 120
damping = 0.25
cutoff = 0
border = 0
seed = 42
sep-factor = 0.8
sep-dark-threshold = 0.45
tol = 0
no-preview = true

[dense]
stipples = 45000
dot-range = 2.5

[dense-zero]
sep-factor = 0
stipples = 45000
dot-range = 2.5
